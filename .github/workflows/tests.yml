# Linux 执行真实 MySQL 回归；Windows 只声明独立工具和前端检查，避免伪造数据库验证。
name: Django MySQL and React checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    env:
      NZ_PROFILE: synthetic
      NZ_DB_HOST: 127.0.0.1
      NZ_DB_PORT: 3307
      NZ_DB_USER: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install MySQL client and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev mysql-client pkg-config
          # CI 覆盖研究工具的纯夹具测试，因此安装其固定测试依赖；
          # 这些 SSH/反汇编依赖仍不进入 Web 或 Launcher 发行包。
          python -m pip install -r requirements.txt -r requirements-catalog.txt -r requirements-recovery.txt -r requirements-dev.txt -r requirements-research.txt
      - name: Start disposable MySQL 8.4 with generated credentials
        run: |
          NZ_DB_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$NZ_DB_PASSWORD"
          printf 'NZ_DB_PASSWORD=%s\n' "$NZ_DB_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name nz-ci-mysql -p 127.0.0.1:3307:3306 -e MYSQL_ROOT_PASSWORD="$NZ_DB_PASSWORD" mysql:8.4
          ready=0
          for attempt in $(seq 1 60); do
            # 官方镜像初始化时有仅监听 socket 的临时 mysqld；mysqladmin ping
            # 即使认证失败也可报告服务存活，必须等待最终 TCP 服务通过真实认证。
            if docker exec -e MYSQL_PWD="$NZ_DB_PASSWORD" nz-ci-mysql mysql --protocol=TCP -h127.0.0.1 --connect-timeout=2 -uroot -e 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker exec -e MYSQL_PWD="$NZ_DB_PASSWORD" nz-ci-mysql mysql --protocol=TCP -h127.0.0.1 --connect-timeout=2 -uroot -e 'CREATE DATABASE nz_current; CREATE DATABASE nz_synthetic;'
      - name: Build and test frontend
        working-directory: admin
        run: |
          npm ci
          npm run build
          npm test
      - name: Check Django and MySQL regression
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python tools/run_tests.py --output evidence/ci/mysql-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-test-results
          path: |
            evidence/ci/mysql-tests.json
            evidence/ci/mysql-tests.txt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      # 独立 Launcher 测试使用 Django 的本机请求工厂；研究工具测试还需
      # SSH/LZO 纯夹具依赖。这里只扩展 CI 环境，发行包继续使用精简依赖。
      - name: Install independent Launcher and catalogue test dependencies
        run: python -m pip install -r requirements-launcher-build.txt -r requirements-dev.txt -r requirements-research.txt
      - name: Independent inventory and catalogue tooling
        run: python tools/run_tests.py --tooling --output evidence/ci/windows-tooling-tests.json
      - name: Frontend build and tests
        working-directory: admin
        run: |
          npm ci
          npm run build
          npm test
      # 报告仅在本轮测试实际运行后生成；失败也上传以保留断言及编码错误证据。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tooling-test-results
          path: |
            evidence/ci/windows-tooling-tests.json
            evidence/ci/windows-tooling-tests.txt
