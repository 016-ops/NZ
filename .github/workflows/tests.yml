name: Local control plane tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test domain, HTTP, inventory tooling and evidence gates
        run: python tools/run_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-test-results-${{ matrix.os }}
          path: |
            evidence/automated-tests.json
            evidence/automated-tests.txt
