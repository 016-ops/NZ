# 本功能分支推送或操作者手动触发生成DEV便携包；只构建，不部署或上传游戏客户端。
name: Build Windows DEV Launcher package
on:
  # 新分支上的workflow也会在相关改动推送时运行，不依赖先把workflow合并进默认分支。
  push:
    branches: ['fix/launcher-portal-admin']
    paths:
      - 'launcher/**'
      - 'admin/**'
      - 'config/**'
      - 'tools/launcher_runtime.py'
      - 'tools/launcher_hooks/**'
      - 'tools/package_launcher*'
      - 'tools/native_launcher.py'
      - 'tools/start_native.py'
      - 'requirements-launcher-build.txt'
      - '.github/workflows/launcher-package.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API or an operator prepared loopback tunnel
        required: true
        default: http://127.0.0.1:18765
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install frozen service build dependencies
        run: python -m pip install -r requirements-launcher-build.txt
      - name: Install stable MSVC Rust with the repository lockfile
        run: rustup toolchain install stable --profile minimal
      - name: Select stable toolchain for this build only
        run: rustup override set stable
      - name: Build portable DEV package
        env:
          NZ_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url || 'http://127.0.0.1:18765' }}
        run: python -m tools.package_launcher --api-base-url "$env:NZ_PUBLIC_API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: NZLauncher-DEV-Windows
          path: |
            launcher/bin/NZLauncher-DEV.zip
            launcher/bin/NZLauncher-DEV/package-manifest.json
          if-no-files-found: error
